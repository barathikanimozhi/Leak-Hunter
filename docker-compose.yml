services:
  leakhunter:
    build: .
    ports:
      - "8501:8501"
    environment:
      EXASOL_DSN: ${EXASOL_DSN:-host.docker.internal:8563}
      EXASOL_USER: ${EXASOL_USER:-sys}
      EXASOL_PASSWORD: ${EXASOL_PASSWORD:?Set EXASOL_PASSWORD in a .env file or your shell}
      LOAD_DATA: ${LOAD_DATA:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
